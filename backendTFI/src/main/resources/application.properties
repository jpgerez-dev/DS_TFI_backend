# Las credenciales se leen de variables de entorno (ver README):
#   DB_URL (opcional, por defecto MySQL local), DB_USER (opcional, por defecto root),
#   DB_PASSWORD y JWT_SECRET (obligatorias). En la nube Render define PORT.

#DATA BASE
spring.datasource.url=${DB_URL:jdbc:mysql://localhost/cursojava?useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=${PORT:8083}

#JWT (el secreto debe estar en Base64: openssl rand -base64 32)
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=Main
#security.jwt.ttlMillis=hours *3600000
security.jwt.ttlMillis=345600000
